name: Scheduled Data Sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-sync]

concurrency:
  group: anime-sync-pipeline
  cancel-in-progress: false

jobs:
  run-sync-pipeline:
    name: Execute Data Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline Worker
        env:
          TURSO_URL: ${{ secrets.TURSO_URL || secrets.DB_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN || secrets.DB_TOKEN }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY || secrets.STORAGE_KEY }}
          GAS_PROXY_URL: ${{ secrets.GAS_PROXY_URL || secrets.RELAY_URL }}
          GAS_PROXY_URL_2: ${{ secrets.GAS_PROXY_URL_2 || secrets.RELAY_URL_2 }}
          GAS_PROXY_URL_3: ${{ secrets.GAS_PROXY_URL_3 || secrets.RELAY_URL_3 }}
        run: |
          python sync_job.py
